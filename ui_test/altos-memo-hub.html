  .writing-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }

  /* Bilingual toggle */
  .lang-toggle {

    border: 1px solid var(--border);

  }
  .lang-btn {

  /* Print */
  @media print {
    .sidebar, .mobile-header, .sidebar-overlay { display: none !important; }
    .main { margin-left: 0 !important; }
    .page-container { max-width: none; padding: 0; }
  }
</style>

function SearchPage({ lang }) {
  const en = lang === 'en';
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);

  const allContent = [
    ...CASE_STUDIES.map(cs => ({ type: en ? "Case Study" : "케이스 스터디", title: en ? cs.title : cs.titleKr, text: `${cs.situation} ${cs.action} ${cs.result}`, tags: cs.competencies })),
    ...FOUNDER_QUESTIONS.map(fq => ({ type: en ? "Q&A" : "질의응답", title: en ? fq.q : fq.qKr, text: en ? fq.a : fq.aKr, tags:[] })),
    ...WRITING_SAMPLES.map(ws => ({ type: ws.type, title: en ? ws.title : ws.titleKr, text: en ? ws.excerpt : ws.excerptKr, tags:[] })),
  ];

  useEffect(() => {
    if (!query.trim()) { setResults([]); return; }
    const q = query.toLowerCase();
    const matched = allContent.filter(item =>
      item.title.toLowerCase().includes(q) ||
      item.text.toLowerCase().includes(q) ||
      item.tags.some(t => t.toLowerCase().includes(q))
    );
    setResults(matched);
  }, [query]);

  return (
    <div className="page-container">
      <p className="section-label">{en ? "SEARCH" : "검색"}</p>
      <h1 className="page-title">{en ? "Search My Evidence" : "내 증거 검색"}</h1>
      <p className="page-subtitle">{en ? "Find specific skills, experiences, or outcomes" : "특정 스킬, 경험 또는 성과 검색"}</p>

      <input
        className="search-input"
        placeholder={en ? "Try: Apple, fundraising, RAG, negotiation..." : "시도: 애플, 펀드레이징, RAG, 협상..."}
        value={query}
        onChange={e => setQuery(e.target.value)}
        autoFocus
      />

      {query && (
        <p style={{fontSize:'0.8rem', color:'var(--text-tertiary)', marginTop:16, marginBottom:16}}>
          {results.length} {en ? "results" : "결과"}
        </p>
      )}

      {results.map((r, i) => (
        <div key={i} className="card" style={{marginBottom:8}}>
          <div style={{display:'flex', gap:8, alignItems:'center', marginBottom:8}}>
            <span className="tag tag-blue">{r.type}</span>
            <span style={{fontSize:'0.85rem', fontWeight:600}}>{r.title}</span>
          </div>
          <p style={{fontSize:'0.8rem'}}>{r.text.slice(0,200)}{r.text.length > 200 ? '...' : ''}</p>
          {r.tags.length > 0 && (
            <div style={{marginTop:8, display:'flex', flexWrap:'wrap', gap:4}}>
              {r.tags.map((t,j) => <span key={j} className="tag">{t}</span>)}
            </div>
          )}
        </div>
      ))}

      {!query && (
        <div style={{marginTop:32, textAlign:'center', color:'var(--text-tertiary)', fontSize:'0.85rem'}}>
          {en ? "Type to search across all evidence, case studies, and Q&A." : "모든 증거, 케이스 스터디, Q&A를 검색하려면 입력하세요."}
        </div>
      )}
    </div>
  );
}

function CopyButton({ text, content }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = () => {
    const el = document.querySelector('.page-container');
    if (el) {
      navigator.clipboard.writeText(el.innerText).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    }
  };
  return (
    <button className="copy-btn" onClick={handleCopy}>
      {copied ? '✓' : '⎘'} {copied ? 'Copied' : text}
    </button>
  );
}

function App() {

  const renderPage = () => {
    switch(page) {

      case 'memo': return <MemoPage lang={lang} />;

      case 'cadence': return <CadencePage lang={lang} />;
      case 'search': return <SearchPage lang={lang} />;
      default: return <HomePage lang={lang} />;

  };

  return (
    <div className="layout">
      {/* Mobile Header */}
      <div className="mobile-header">
        <button className="mobile-menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>☰</button>

          </div>
        </div>
      </div>

      {/* Sidebar Overlay */}
      <div className={`sidebar-overlay ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)} />

      {/* Sidebar */}

        <div className="sidebar-header">
          <h1>{en ? "CANDIDATE MEMO" : "후보자 메모"}</h1>
          <div className="name">{CANDIDATE.name}</div>
          <div className="role">{en ? "→ Altos Ventures · Investment Professional" : "→ 알토스벤처스 · 투자 전문가"}</div>
        </div>
        <div className="sidebar-nav">
          {NAV_ITEMS.map(item => (
            <button

              className={`nav-item ${page === item.id ? 'active' : ''}`}

              <span className="nav-icon">{item.icon}</span>

            <button className={`lang-btn ${lang==='kr'?'active':''}`} onClick={()=>setLang('kr')}>KR</button>
          </div>
          <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>
            {theme === 'light' ? '◐ Dark' : '◑ Light'}
          </button>
        </div>
      </nav>

      {/* Main Content */}
      <main className="main" key={page}>
        {renderPage()}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
