<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DJ Lee</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    @keyframes enterUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes expandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    @keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes shimmerSlide{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    @keyframes breathe{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    @keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(60px,-30px) scale(1.1)}50%{transform:translate(-20px,-60px) scale(.95)}75%{transform:translate(-50px,20px) scale(1.05)}}
    @keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(-40px,40px) scale(.9)}50%{transform:translate(50px,20px) scale(1.1)}75%{transform:translate(20px,-40px) scale(1)}}
    @keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,50px) scale(1.05)}66%{transform:translate(-60px,-20px) scale(.95)}}
    @keyframes lineGlow{0%,100%{opacity:.4}50%{opacity:.9}}

    .enter-up{animation:enterUp .8s cubic-bezier(.22,1,.36,1) both}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
    .d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}

    button{cursor:pointer;border:none;background:none;font-family:inherit}
    input:focus,textarea:focus{outline:none}
    ::selection{background:rgba(99,102,241,.2)}
    a{text-decoration:none}
    .serif{font-family:'Source Serif 4',Georgia,serif}
    .sb::-webkit-scrollbar{width:3px}
    .sb::-webkit-scrollbar-track{background:transparent}
    .sb::-webkit-scrollbar-thumb{background:rgba(128,128,128,.12);border-radius:8px}

    /* Noise */
    .noise::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.02;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat:repeat;background-size:256px;
    }

    /* Animated gradient divider — brighter */
    .gradient-line{height:1px;position:relative;overflow:hidden}
    .gradient-line::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(90deg,transparent 5%,rgba(124,130,248,.5) 25%,rgba(167,139,250,.6) 50%,rgba(244,114,182,.4) 75%,transparent 95%);
      background-size:200% 100%;
      animation:gradientFlow 6s ease infinite;
    }

    /* Shimmer */
    .shimmer-hover{position:relative;overflow:hidden}
    .shimmer-hover::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);
      transform:translateX(-100%);pointer-events:none;
    }
    .shimmer-hover:hover::after{animation:shimmerSlide .6s ease}

    /* Name gradient — more visible */
    .name-gradient{
      background:linear-gradient(135deg,#c8c8f0 0%,#818cf8 30%,#a78bfa 50%,#c4b5fd 70%,#e0e0f0 100%);
      background-size:300% 100%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:gradientFlow 8s ease infinite;
    }
    .name-gradient-light{
      background:linear-gradient(135deg,#2a2a3e 0%,#4f46e5 30%,#7c3aed 50%,#6d28d9 70%,#2a2a3e 100%);
      background-size:300% 100%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:gradientFlow 8s ease infinite;
    }

    /* Input focus glow */
    .input-glow{transition:box-shadow .3s ease,border-color .3s ease}
    .input-glow:focus-within{
      border-color:rgba(124,130,248,.35)!important;
      box-shadow:0 0 0 4px rgba(124,130,248,.08),0 0 24px rgba(124,130,248,.06),0 1px 4px rgba(0,0,0,.2)!important;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,createContext,useContext,useCallback} = React;

/* ═══════════════════════════════════════
   THEME
   ═══════════════════════════════════════ */
const themes = {
  dark: {
    bg:"#0a0a0c",
    surface:"#131316",
    surfaceRaised:"#19191c",
    surfaceHover:"#1d1d22",

    textMut:"#5a5a66",
    accent:"#818cf8",
    accent2:"#a78bfa",
    accent3:"#f472b6",
    accentMuted:"#6366b8",
    accentSoft:"rgba(129,140,248,.06)",
    tagBg:"rgba(129,140,248,.07)",
    tagBorder:"rgba(129,140,248,.14)",
    inputBg:"#0f0f12",
    shadow:"rgba(0,0,0,.5)",
    chatBubble:"#151518",
    nameClass:"name-gradient",
    orb1:"rgba(129,140,248,.07)",
    orb2:"rgba(167,139,250,.05)",
    orb3:"rgba(244,114,182,.04)",
  },
  light: {
    bg:"#f5f5f3",
    surface:"#ffffff",
    surfaceRaised:"#ffffff",
    surfaceHover:"#eeeeed",
    border:"#d8d8d4",
    borderSoft:"#e4e4e0",
    borderAccent:"#b0b0c0",
    text:"#141418",
    textSec:"#44444c",
    textMut:"#78787e",
    accent:"#4f46e5",
    accent2:"#6d28d9",
    accent3:"#be185d",
    accentMuted:"#5558c0",
    accentSoft:"rgba(79,70,229,.05)",
    tagBg:"rgba(79,70,229,.06)",
    tagBorder:"rgba(79,70,229,.14)",
    inputBg:"#ffffff",
    shadow:"rgba(0,0,0,.08)",
    chatBubble:"#eeeeec",
    nameClass:"name-gradient-light",
    orb1:"rgba(79,70,229,.05)",
    orb2:"rgba(109,40,217,.04)",
    orb3:"rgba(190,24,93,.03)",
  },
};
const ThemeCtx = createContext();
const useTheme = ()=>useContext(ThemeCtx);

/* ═══════════════════════════════════════
   ICONS
   ═══════════════════════════════════════ */
const ChevronIcon = ({open,color})=>(
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style={{transition:'transform .35s cubic-bezier(.22,1,.36,1)',transform:open?'rotate(180deg)':'rotate(0)'}}>
    <path d="M5 7l4 4 4-4" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const ArrowIcon = ({color})=>(
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M3.5 8h9m0 0L9 4.5M12.5 8L9 11.5" stroke={color} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);
const SunMoonIcon = ({isDark,color})=> isDark ? (
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="3" stroke={color} strokeWidth="1.2"/><path d="M7.5 1.5v1.5m0 9v1.5m-4.24-10.74l1.06 1.06m6.36 6.36l1.06 1.06M1.5 7.5H3m9 0h1.5m-10.74 4.24l1.06-1.06m6.36-6.36l1.06-1.06" stroke={color} strokeWidth="1.2" strokeLinecap="round"/></svg>
) : (
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M13.5 8.5a6 6 0 01-7-7 6 6 0 107 7z" stroke={color} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
);

/* ═══════════════════════════════════════
   DATA
   ═══════════════════════════════════════ */
const TOPICS = [
  { id:"career", label:"Career path", desc:"Engineer → Team Lead → Co-Founder → Director", accent:"#818cf8",
    content: [
      {title:"Director, Business & Publishing", org:"Devs United Games", period:"Feb 2024 – Aug 2025", text:"Led partnerships with Apple, Meta, and Google for an XR game studio. Managed the Apple Vision Pro launch, negotiated Meta Quest+ entry (55% YoY revenue growth), opened the Google Android XR relationship. Oversaw business operations, HR, legal, finance."},
      {title:"Co-Founder & COO", org:"Flint Technologies", period:"May 2021 – Feb 2024", text:"Co-founded an AI startup building a knowledge management tool powered by Graph Neural Networks. Directed strategy and investor relations, securing KRW 450M in funding. Built the product feedback pipeline and GTM strategy from scratch. Grew to 860 organic users."},
      {title:"Team Lead → Software Engineer", org:"TmaxTibero", period:"Feb 2018 – May 2021", text:"Started as a software engineer on Big Data and autonomous database systems (Hadoop, Kubernetes). Promoted to Team Lead managing enterprise clients including Samsung Electronics and Hyundai. Bridged R&D and business needs."},
    ]},
  { id:"partnerships", label:"Partnerships & deals", desc:"Apple, Meta, Google — how each one worked differently", accent:"#a78bfa",
    content: [
      {title:"Apple — trust through delivery", org:"Devs United Games", period:"2024", text:"Apple never confirms anything directly. Their dev rel acts as an intermediary with no guarantees. The strategy: say yes to every opportunity and deliver exceptionally. Result: featured on the Vision Pro App Store at launch."},
      {title:"Meta — data-driven evaluation", org:"Devs United Games", period:"2024–25", text:"Evaluated Meta Quest+ subscription entry by analyzing cannibalization risk vs. upside. Separately renegotiated a previously dropped funding deal — ultimately walked away when the revenue share terms didn't serve long-term interests."},
      {title:"Google — leveraging track record", org:"Devs United Games", period:"2024–25", text:"Used Meta + Apple track record to open the Google relationship for Android XR. Negotiated dev kit access, schedule alignment, and pushed for upfront-heavy funding to support development cash flow."},
    ]},
  { id:"technical", label:"Technical work", desc:"RAG systems, GNN, database engineering, full-stack", accent:"#38bdf8",
    content: [
      {title:"RAG systems (Pinecone + Gemini)", org:"Personal / Current", period:"2024–present", text:"Built end-to-end retrieval-augmented generation pipelines. Created hundreds of test Q&A pairs, systematically evaluated output quality, and iterated on schema design to reduce hallucinations."},
      {title:"GNN-powered knowledge tool", org:"Flint Technologies", period:"2021–24", text:"The core product used Graph Neural Networks for automatic knowledge retrieval — when you saved a note, the system surfaced relevant past notes. Multi-modal similarity: graph context + keyword matching. Key lesson: even great AI can't overcome UX friction."},
      {title:"Enterprise database systems", org:"TmaxTibero", period:"2018–21", text:"Worked on Big Data platforms (Hadoop, Kubernetes), co-developed an autonomous database with ML, and did hands-on performance tuning for enterprise migrations — including overnight on-site work at client facilities."},

  { id:"approach", label:"How I work", desc:"Negotiation philosophy, lessons learned, what drives me", accent:"#f472b6",
    content: [
      {title:"Partner-first negotiation", org:"", period:"", text:"Every company has a different internal culture. Before discussing deal terms, I try to understand: how is my counterpart evaluated? What are their KPIs? How does their organization actually make decisions? I gather this through casual conversation, not formal discovery. It changes how I structure every deal."},

      {title:"What I'm looking for", org:"", period:"", text:"A role where business strategy and technology aren't separate departments. I'm at my best when I can understand the technical architecture and use that understanding to close better deals, build better products, and make better decisions."},
    ]},
];

const SUGGESTED = [
  "What was the hardest deal you walked away from?",
  "How did you handle Apple's indirect communication style?",
  "What would you do differently at Flint?",
  "Tell me about a time you failed.",
];

/* ═══════════════════════════════════════
   FLOATING ORBS — ambient background
   ═══════════════════════════════════════ */
function FloatingOrbs(){
  const t = useTheme();
  return <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden'}}>
    <div style={{
      position:'absolute', top:'10%', left:'15%',
      width:400, height:400, borderRadius:'50%', filter:'blur(80px)',
      background:t.orb1, animation:'orbFloat1 20s ease-in-out infinite',
    }}/>
    <div style={{
      position:'absolute', top:'40%', right:'10%',
      width:350, height:350, borderRadius:'50%', filter:'blur(80px)',
      background:t.orb2, animation:'orbFloat2 25s ease-in-out infinite',
    }}/>
    <div style={{
      position:'absolute', bottom:'15%', left:'40%',
      width:300, height:300, borderRadius:'50%', filter:'blur(80px)',
      background:t.orb3, animation:'orbFloat3 22s ease-in-out infinite',
    }}/>
  </div>;
}

/* ═══════════════════════════════════════
   CURSOR GLOW — follows the mouse
   ═══════════════════════════════════════ */
function CursorGlow(){
  const t = useTheme();
  const [pos,setPos] = useState({x:-200,y:-200});
  useEffect(()=>{
    const h = e => setPos({x:e.clientX,y:e.clientY});
    window.addEventListener('mousemove',h,{passive:true});
    return ()=>window.removeEventListener('mousemove',h);
  },[]);
  return <div style={{
    position:'fixed', pointerEvents:'none', zIndex:1,
    left:pos.x-200, top:pos.y-200,
    width:400, height:400, borderRadius:'50%',
    background:`radial-gradient(circle, ${t.accent}08 0%, transparent 70%)`,
    transition:'left .15s ease-out, top .15s ease-out',
  }}/>;
}

/* ═══════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════ */
function TopicRow({topic, isOpen, onToggle, index}){
  const t = useTheme();
  const [hovered, setHovered] = useState(false);

  return <div className={`enter-up d${index+1}`}>
    <button
      onClick={onToggle}
      onMouseEnter={()=>setHovered(true)}
      onMouseLeave={()=>setHovered(false)}
      style={{
        width:'100%', textAlign:'left',
        padding:'20px 20px 20px 26px',
        borderRadius:16,
        background: isOpen ? `linear-gradient(135deg, ${topic.accent}08, ${t.accent2}05)` : hovered ? t.surfaceHover : 'transparent',
        border: `1px solid ${isOpen ? topic.accent+'30' : hovered ? t.border : 'transparent'}`,
        display:'flex', justifyContent:'space-between', alignItems:'center',
        transition:'all .3s cubic-bezier(.22,1,.36,1)',
        marginBottom: isOpen ? 0 : 4,
        position:'relative', overflow:'hidden',
        boxShadow: isOpen ? `0 4px 30px ${topic.accent}12, inset 0 1px 0 ${topic.accent}10` : hovered ? `0 2px 20px ${topic.accent}0a` : 'none',
      }}
    >
      {/* Left accent bar — gradient */}
      <div style={{
        position:'absolute', left:0, top:isOpen?0:'15%', bottom:isOpen?0:'15%',
        width: isOpen?3:2, borderRadius:'0 3px 3px 0',
        background: isOpen ? `linear-gradient(180deg, ${topic.accent}, ${t.accent2}, ${t.accent3})` : hovered ? topic.accent : 'transparent',
        transition:'all .35s cubic-bezier(.22,1,.36,1)',
        opacity: isOpen ? 1 : hovered ? .7 : 0,
        boxShadow: isOpen ? `0 0 12px ${topic.accent}40` : 'none',
      }}/>

      <div style={{flex:1}}>
        <div style={{
          fontSize:15, fontWeight:500, letterSpacing:'-0.01em',
          color: isOpen ? t.text : hovered ? t.text : t.textSec,
          transition:'color .2s', marginBottom:3,
        }}>{topic.label}</div>
        <div style={{fontSize:12.5, color:t.textMut, fontWeight:300, letterSpacing:'.005em'}}>{topic.desc}</div>
      </div>
      <ChevronIcon open={isOpen} color={isOpen ? topic.accent : t.textMut}/>
    </button>

    {isOpen && <div style={{
      padding:'8px 26px 24px',
      background:`linear-gradient(180deg, ${topic.accent}04, transparent)`,
      borderLeft:`1px solid ${topic.accent}20`,
      borderRight:`1px solid ${topic.accent}20`,
      borderBottom:`1px solid ${topic.accent}20`,
      borderRadius:'0 0 16px 16px',
      marginBottom:4,
      animation:'expandIn .35s cubic-bezier(.22,1,.36,1) both',
    }}>
      {topic.content.map((item,j)=>(
        <div key={j} style={{
          padding:'18px 0',
          borderBottom: j < topic.content.length-1 ? `1px solid ${t.borderSoft}` : 'none',
        }}>
          <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:item.period?2:8,flexWrap:'wrap'}}>
            <span style={{fontSize:14, fontWeight:500, color:t.text, letterSpacing:'-0.01em'}}>{item.title}</span>
            {item.org && <span style={{fontSize:12, color:t.textMut, fontWeight:400}}>· {item.org}</span>}
          </div>
          {item.period && <div style={{fontSize:11.5, color:t.textMut, marginBottom:8, fontWeight:400, letterSpacing:'.01em'}}>{item.period}</div>}
          <p style={{fontSize:13.5, color:t.textSec, lineHeight:1.75, fontWeight:300}}>{item.text}</p>
        </div>
      ))}
    </div>}
  </div>;
}

function ChatMessage({msg, index}){
  const t = useTheme();
  const isUser = msg.role === 'user';
  return <div style={{
    display:'flex', justifyContent:isUser?'flex-end':'flex-start',
    animation:'expandIn .3s cubic-bezier(.22,1,.36,1) both',
    animationDelay:`${index*.04}s`, marginBottom:12,
  }}>
    <div style={{
      maxWidth:'85%', padding:'12px 16px',
      borderRadius: isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
      background: isUser ? `linear-gradient(135deg, ${t.accent}, ${t.accent2})` : t.chatBubble,
      color: isUser ? '#fff' : t.textSec,
      fontSize:14, lineHeight:1.7, fontWeight:300,
      border: isUser ? 'none' : `1px solid ${t.borderSoft}`,
      boxShadow: isUser ? `0 4px 20px ${t.accent}30` : `0 1px 4px ${t.shadow}`,
    }}>{msg.text}</div>
  </div>;
}

/* ═══════════════════════════════════════
   APP
   ═══════════════════════════════════════ */
function App(){
  const [mode,setMode] = useState('dark');
  const [activeTopic,setActiveTopic] = useState(null);
  const [messages,setMessages] = useState([]);
  const [input,setInput] = useState('');
  const [chatActive,setChatActive] = useState(false);
  const chatEndRef = useRef(null);
  const t = themes[mode];

  useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:'smooth'})},[messages]);

  const handleSend = async (text)=>{
    const q = text || input;
    if(!q.trim()) return;
    const history = messages.map(m=>({role:m.role,text:m.text}));
    setMessages(prev=>[...prev,{role:'user',text:q},{role:'assistant',text:'Thinking...'}]);
    setInput(''); setChatActive(true);
    try{
      const res = await fetch('/api/ui-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,personaId:'hiring',focusId:'fullstack',history})});
      const data = await res.json();
      setMessages(prev=>[...prev.slice(0,-1),{role:'assistant',text:data.response||'Sorry, something went wrong.'}]);
    }catch(e){
      setMessages(prev=>[...prev.slice(0,-1),{role:'assistant',text:'Sorry, something went wrong. Please try again.'}]);
    }
  };

  return <ThemeCtx.Provider value={t}>
    <div className="noise" style={{background:t.bg,color:t.text,minHeight:'100vh',transition:'background .4s,color .3s',position:'relative'}}>

      <FloatingOrbs/>
      <CursorGlow/>

      {/* Theme toggle */}
      <button onClick={()=>setMode(m=>m==='dark'?'light':'dark')} style={{
        position:'fixed', top:24, right:28, zIndex:50,
        width:38, height:38, borderRadius:12,
        background:t.surface+'e0',
        backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)',
        border:`1px solid ${t.border}`,
        display:'flex',alignItems:'center',justifyContent:'center',
        transition:'all .25s cubic-bezier(.22,1,.36,1)',
        boxShadow:`0 2px 8px ${t.shadow}`,
      }}
      onMouseEnter={e=>{e.currentTarget.style.borderColor=t.accent+'50';e.currentTarget.style.transform='scale(1.08)';e.currentTarget.style.boxShadow=`0 2px 16px ${t.accent}15`}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor=t.border;e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow=`0 2px 8px ${t.shadow}`}}
      >
        <SunMoonIcon isDark={mode==='dark'} color={t.textMut}/>
      </button>

      {/* Content */}
      <div style={{maxWidth:640,margin:'0 auto',padding:'96px 28px 140px',position:'relative',zIndex:2}}>

        {/* ═══ HEADER ═══ */}
        <header className="enter-up" style={{marginBottom:64}}>
          <div className="enter-up" style={{display:'flex',alignItems:'center',gap:8,marginBottom:18}}>
            <div style={{
              width:7, height:7, borderRadius:'50%',
              background:t.accent,
              animation:'breathe 3s ease-in-out infinite',
              boxShadow:`0 0 10px ${t.accent}60`,
            }}/>
            <span style={{fontSize:11, color:t.textMut, letterSpacing:'.07em', textTransform:'uppercase', fontWeight:500}}>
              AI-powered brief
            </span>
          </div>

          <h1 className={`serif ${t.nameClass}`} style={{
            fontSize:48, fontWeight:400, letterSpacing:'-0.03em',
            lineHeight:1.1, marginBottom:22,
          }}>
            Dong Jae (DJ) Lee
          </h1>

          <p className="enter-up d1" style={{
            fontSize:15.5, color:t.textSec, lineHeight:1.8,
            fontWeight:300, maxWidth:540, marginBottom:30,
          }}>
            Business development and product strategy, with an engineering background.
            I've led partnerships with Apple, Meta, and Google, co-founded an AI startup,
            and I still write code. Currently based in Seoul.
          </p>

          <div className="enter-up d2" style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {["KAIST · KIT (Germany)","Korean · English · German","Seoul, South Korea"].map((c,i)=>(
              <span key={i} className="shimmer-hover" style={{
                fontSize:11.5, color:t.textMut, fontWeight:400,
                padding:'6px 14px', borderRadius:9,
                background:t.tagBg, border:`1px solid ${t.tagBorder}`,
                letterSpacing:'.01em', transition:'all .3s',
              }}>{c}</span>
            ))}
          </div>
        </header>

        <div className="gradient-line enter-up d3" style={{marginBottom:48}}/>

        {/* ═══ TOPICS ═══ */}
        <div style={{marginBottom:56}}>
          <p className="enter-up d3" style={{fontSize:13, color:t.textMut, marginBottom:20, letterSpacing:'.015em', fontWeight:400}}>
            What would you like to know?
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {TOPICS.map((topic,i)=>(
              <TopicRow key={topic.id} topic={topic}
                isOpen={activeTopic===topic.id}
                onToggle={()=>setActiveTopic(prev=>prev===topic.id?null:topic.id)}
                index={i}
              />
            ))}
          </div>
        </div>

        <div className="gradient-line" style={{marginBottom:48}}/>

        {/* ═══ CHAT ═══ */}
        <div className="enter-up d5">
          <p style={{fontSize:13, color:t.textMut, marginBottom:20, letterSpacing:'.015em', fontWeight:400}}>
            Or ask directly.
          </p>

          {!chatActive && <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:28}}>
            {SUGGESTED.map((q,i)=>{
              const [h,setH] = useState(false);
              return <button key={i}
                onClick={()=>handleSend(q)}
                onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
                style={{
                  textAlign:'left', fontSize:14, padding:'11px 16px',
                  color: h ? t.text : t.textSec,
                  background: h ? `linear-gradient(135deg, ${t.accent}08, ${t.accent2}05)` : 'transparent',
                  borderRadius:12,
                  border:`1px solid ${h ? t.accent+'25' : 'transparent'}`,
                  transition:'all .25s cubic-bezier(.22,1,.36,1)',
                  fontWeight:400, letterSpacing:'-0.005em',
                  display:'flex', alignItems:'center', justifyContent:'space-between',
                  boxShadow: h ? `0 2px 16px ${t.accent}0a` : 'none',
                }}
              >
                <span>{q}</span>
                <span style={{opacity:h?1:0,transition:'all .25s',flexShrink:0,marginLeft:8,transform:h?'translateX(0)':'translateX(-6px)'}}>
                  <ArrowIcon color={t.accent}/>
                </span>
              </button>;
            })}
          </div>}

          {chatActive && <div className="sb" style={{maxHeight:360,overflowY:'auto',marginBottom:16,padding:'4px 0'}}>
            {messages.map((m,i)=><ChatMessage key={i} msg={m} index={i}/>)}
            <div ref={chatEndRef}/>
          </div>}

          <div className="input-glow" style={{
            display:'flex', alignItems:'center', gap:8,
            padding:'6px 6px 6px 18px',
            background:t.inputBg+'e0',
            backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)',
            borderRadius:16,
            border:`1px solid ${t.border}`,
            boxShadow:`0 2px 8px ${t.shadow}`,
          }}>
            <input
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter')handleSend()}}
              placeholder="Type a question…"
              style={{
                flex:1, padding:'11px 0', fontSize:14,
                background:'transparent', border:'none', color:t.text,
                fontFamily:'Inter', fontWeight:300, letterSpacing:'-0.005em',
              }}
            />
            <button onClick={()=>handleSend()} style={{
              padding:'11px 20px', borderRadius:12,
              fontSize:13, fontWeight:500, letterSpacing:'.01em',
              background: input.trim() ? `linear-gradient(135deg, ${t.accent}, ${t.accent2})` : t.surfaceRaised,
              color: input.trim() ? '#fff' : t.textMut,
              transition:'all .25s cubic-bezier(.22,1,.36,1)',
              border: input.trim() ? 'none' : `1px solid ${t.borderSoft}`,
              boxShadow: input.trim() ? `0 4px 16px ${t.accent}28` : 'none',
            }}
            onMouseEnter={e=>{if(input.trim())e.currentTarget.style.transform='scale(1.03)'}}
            onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}
            >Ask</button>
          </div>
        </div>

        {/* ═══ FOOTER ═══ */}
        <footer style={{
          marginTop:80, paddingTop:28,
          borderTop:`1px solid ${t.borderSoft}`,
          display:'flex', alignItems:'center', gap:20,
        }}>
          {[
            {label:"LinkedIn", href:"https://www.linkedin.com/in/dongjae-lee/"},
            {label:"Email", href:"mailto:leedj.1076@gmail.com"},
          ].map(link=>{
            const [h,setH] = useState(false);
            return <a key={link.label} href={link.href} target={link.href.startsWith('http')?'_blank':undefined}
              rel="noopener" onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
              style={{fontSize:12.5, color:h?t.accent:t.textMut, transition:'color .2s', fontWeight:400}}
            >{link.label}</a>;
          })}
          <span style={{fontSize:11, color:t.textMut, marginLeft:'auto', fontWeight:300, letterSpacing:'.01em'}}>
            Answers powered by AI
          </span>
        </footer>
      </div>
    </div>
  </ThemeCtx.Provider>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
