      kr: `2024년, 이동재는 Devs United Games에서 55.47%의 YoY 매출 성장을[E1] 이끌었습니다 — 점진적인 영업 전술이 아닌, Meta[E2]와 Apple[E3]과의 글로벌 유통 파트너십을 설계함으로써. 플랫폼 계약을 협상하여 소규모 한국 게임 스튜디오를 국제 경쟁력을 갖춘 퍼블리셔로 전환했습니다. 이것은 일회성 급등이 아니었습니다: 분기마다 복리로 쌓이는 반복 가능한 채널 파트너십 위에 구축된 구조적 성장이었습니다.\n\n운영 인재를 평가하는 투자자에게 이것이 바로 신호입니다 — 훌륭한 기술을 만드는 것은 필요하지만 충분하지 않다는 것을 이해하는 사람. 유통이 배수기입니다.`,

/* ═══════════════════════════════════════════════════════
   TEXT WITH EVIDENCE MARKERS
   ═══════════════════════════════════════════════════════ */
function EvidencedText({text}) {
  const [openEvidence, setOpenEvidence] = useState(null);

  if (!text) return null;

  // Parse text for [E#] markers
  const parts = text.split(/(\[E\d+\])/g);

  return (
    <span>
      {parts.map((part, i) => {
        const match = part.match(/^\[(E\d+)\]$/);
        if (match) {
          const eid = match[1];
          return (
            <span key={i} style={{position:'relative', display:'inline'}}>
              <span className="evidence-sup"
                onClick={(e) => { e.stopPropagation(); setOpenEvidence(openEvidence === eid ? null : eid); }}
              >{eid}</span>
              {openEvidence === eid && (
                <EvidencePopover evidenceId={eid} onClose={() => setOpenEvidence(null)}/>
              )}
            </span>
          );
        }
        return <span key={i}>{part}</span>;
      })}
    </span>
  );
}

/* ═══════════════════════════════════════════════════════
   INLINE AI THREAD — with streaming
   ═══════════════════════════════════════════════════════ */
function InlineThread({sectionId, contextText, onClose, lang, sessionId}) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [streaming, setStreaming] = useState(false);
  const inputRef = useRef(null);
  const endRef = useRef(null);
  const en = lang === 'en';

  useEffect(() => { inputRef.current?.focus(); }, []);
  useEffect(() => { endRef.current?.scrollIntoView({behavior:'smooth'}); }, [messages, streaming]);

  const handleSend = async () => {
    const q = input.trim();
    if (!q || streaming) return;

    const citationSystemPrompt = `You are the memo assistant for DJ Lee's Auditable Memo. Your primary goal is epistemic reliability, not fluency.
Rules: 1) When stating a factual claim supported by the evidence ledger, append citation markers: [E1], [E2], etc. 2) If evidence is missing, say: "Insufficient evidence in the memo to answer this." 3) You may add a cautious hypothesis only if clearly labeled "Inference:" followed by what evidence would validate it. 4) Never invent evidence IDs, numbers, partnerships, dates, or outcomes. 5) Prefer short, decision-useful answers: claim → evidence → implication. 6) Match the user's language (Korean or English). Keep [E#] markers unchanged in both languages.
Evidence Ledger: E1=55.47% YoY revenue increase, E2=Meta Quest+ partnership, E3=Apple Vision Pro partnership, E4=₩450M pre-seed, E5=GNN recommendation engine, E6=Enterprise deals Samsung/Hyundai/KT/POSCO, E7=TestDaF 5/5/4/5, E8=KAIST+KIT dual M.S., E9=RAG pipeline, E10=COO/Co-founder Flint, E11=Revenue cannibalization analysis, E12=7+ years experience.`;
    const contextPrompt = `${citationSystemPrompt}\n\nContext from the memo section "${sectionId}": "${contextText.slice(0,500)}..." \n\nUser question: ${q}`;

    // Build AI SDK messages array from thread history + new question
    const allMessages = messages.map(m => ({role: m.role, content: m.text}));
    allMessages.push({role:'user', content: contextPrompt});

    // Build ui-chat history format (for fallback)
    const history = messages.map(m => ({role: m.role, text: m.text}));

    setMessages(p => [...p, {role:'user', text:q}]);
    setInput('');
    setStreaming(true);

    // Add empty assistant message for streaming
    const assistantIdx = messages.length + 1;
    setMessages(p => [...p, {role:'assistant', text:''}]);

    try {
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          messages: allMessages,
          visitorData: {persona:'vc_investor', focus:'leadership_strategy'},
          lang: lang === 'kr' ? 'ko' : 'en',
          sessionId: sessionId,
        }),
      });

      if (!res.ok) {
        // Fallback to non-streaming ui-chat endpoint
        const fallbackRes = await fetch('/api/ui-chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({query: contextPrompt, personaId:'vc', focusId:'leadership', history}),
        });
        const data = await fallbackRes.json();
        setMessages(p => {
          const updated = [...p];
          updated[assistantIdx] = {role:'assistant', text: data.response || (en ? 'Unable to generate a response.' : '응답을 생성할 수 없습니다.')};
          return updated;
        });
        setStreaming(false);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let accumulated = '';
      let lineBuffer = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        lineBuffer += decoder.decode(value, {stream:true});
        const lines = lineBuffer.split('\n');
        lineBuffer = lines.pop() || ''; // Keep incomplete last line in buffer

        for (const line of lines) {
          if (line.startsWith('0:')) {
            try {
              const text = JSON.parse(line.slice(2));
              accumulated += text;
              setMessages(p => {
                const updated = [...p];
                updated[assistantIdx] = {role:'assistant', text: accumulated};
                return updated;
              });
            } catch {}
          }
        }
      }

      // If no streaming text came through, show fallback
      if (!accumulated) {
        setMessages(p => {
          const updated = [...p];
          updated[assistantIdx] = {role:'assistant', text: en ? 'Response completed.' : '응답 완료.'};
          return updated;
        });
      }
    } catch {
      setMessages(p => {
        const updated = [...p];
        updated[assistantIdx] = {role:'assistant', text: en ? 'Connection error. Please try again.' : '연결 오류. 다시 시도해주세요.'};
        return updated;
      });
    }
    setStreaming(false);
  };

  return (
    <div style={{borderLeft:'2px solid #a5b4fc', paddingLeft:20, marginLeft:4, marginTop:20, marginBottom:8, animation:'fadeSlideIn .3s ease-out'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
        <span style={{fontSize:11, fontWeight:600, color:'#6366f1', textTransform:'uppercase', letterSpacing:'.1em'}}>
          AI Thread — {en ? 'Evidence-Grounded' : '근거 기반'}
        </span>
        <button onClick={onClose} style={{fontSize:12, color:'#a1a1aa', cursor:'pointer', padding:'2px 6px', borderRadius:4, border:'1px solid #e4e4e7', background:'#fff', fontFamily:'Inter,sans-serif'}}
          onMouseEnter={e => e.target.style.background='#f4f4f5'}
          onMouseLeave={e => e.target.style.background='#fff'}>
          {en ? 'Close' : '닫기'}
        </button>
      </div>

      {messages.map((m,i) => (
        <div key={i} style={{marginBottom:10}}>
          {m.role === 'user' ? (
            <div style={{fontSize:13, color:'#52525b', fontWeight:500}}>
              <span style={{color:'#818cf8', marginRight:6}}>Q:</span>{m.text}
            </div>
          ) : (
            <div style={{background:'#eef2ff', border:'1px solid #e0e7ff', padding:14, borderRadius:8, fontSize:13, color:'#3f3f46', lineHeight:1.7, animation:'fadeSlideIn .25s ease-out'}}>
              <MemoMd text={m.text}/>
              {streaming && i === messages.length - 1 && (
                <span style={{display:'inline-block', width:2, height:14, background:'#6366f1', marginLeft:2, animation:'pulse 1s infinite', verticalAlign:'text-bottom'}}/>
              )}
            </div>
          )}
        </div>
      ))}

      {streaming && messages.length > 0 && messages[messages.length-1].text === '' && (
        <div style={{background:'#eef2ff', border:'1px solid #e0e7ff', padding:14, borderRadius:8}}>
          <div style={{display:'flex', gap:5}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#a5b4fc',animation:'pulse 1.2s infinite'}}/>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#a5b4fc',animation:'pulse 1.2s .15s infinite'}}/>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#a5b4fc',animation:'pulse 1.2s .3s infinite'}}/>
          </div>
        </div>
      )}

      <form onSubmit={e => { e.preventDefault(); handleSend(); }} style={{display:'flex', gap:8, marginTop:10}}>
        <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} disabled={streaming}
          placeholder={en ? 'Ask a follow-up...' : '추가 질문...'}
          style={{flex:1, fontSize:13, padding:'8px 12px', border:'1px solid #e4e4e7', borderRadius:8, fontFamily:'Inter,sans-serif', color:'#27272a', background:'#fff'}}
        />
        <button type="submit" disabled={streaming || !input.trim()}
          style={{fontSize:12, fontWeight:500, color:'#fff', background: (streaming || !input.trim()) ? '#d4d4d8' : '#6366f1', padding:'8px 14px', borderRadius:8, fontFamily:'Inter,sans-serif', cursor: (streaming || !input.trim()) ? 'default' : 'pointer', border:'none'}}>
          {en ? 'Send' : '전송'}
        </button>
      </form>
      <div ref={endRef}/>
    </div>
  );
}

function MemoMd({text}) {
  if (!text) return null;
  const html = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n- /g, '<br/>&#8226; ')
    .replace(/\n\* /g, '<br/>&#8226; ')
    .replace(/\n\n/g, '<br/><br/>')
    .replace(/\n/g, '<br/>');
  return <span dangerouslySetInnerHTML={{__html: html}}/>;
}

  useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach(entry => {

            setActiveSection(entry.target.dataset.sectionId);
          }
        });
      },
      {rootMargin:'-20% 0px -60% 0px', threshold:0}
    );

    Object.values(sectionRefs.current).forEach(el => {
      if (el) observer.observe(el);
    });

    return () => observer.disconnect();
  }, [readingPath]);

    sectionRefs.current[id]?.scrollIntoView({behavior:'smooth', block:'start'});

        onJump={jumpToSection}
      />

      {/* ═══ MEMO BODY ═══ */}
      <article style={{maxWidth:720, margin:'0 auto', padding:'80px 32px 120px'}}>

        {/* Title block */}
        <header style={{marginBottom:64}}>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:20}}>
            <span style={{
              fontSize:9, fontWeight:700, letterSpacing:'.1em', textTransform:'uppercase',
              padding:'3px 8px', borderRadius:4,
              background:'#eef2ff', border:'1px solid #e0e7ff', color:'#4338ca',
            }}>V13 — {en ? 'Auditable+' : '감사 가능+'}</span>
            <span style={{
              fontSize:9, fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase',
              padding:'3px 8px', borderRadius:4,
              background:'#f0fdf4', border:'1px solid #bbf7d0', color:'#166534',
            }}>{Object.keys(EVIDENCE).length} {en ? 'evidence anchors' : '근거 앵커'}</span>
          </div>

          <h1 className="serif" style={{fontSize:42, fontWeight:700, color:'#18181b', lineHeight:1.15, letterSpacing:'-0.02em', marginBottom:20}}>
            {en ? 'Investment Memo:' : '투자 메모:'}<br/>
            <span style={{color:'#52525b'}}>Dong Jae Lee</span>
          </h1>
          <div style={{display:'flex', flexWrap:'wrap', alignItems:'center', gap:12, fontSize:13, color:'#a1a1aa'}}>
            <span>{en ? 'February 2026' : '2026년 2월'}</span>
            <span style={{color:'#e4e4e7'}}>|</span>
            <span>{en ? 'Deep Tech / Operator' : '딥테크 / 운영자'}</span>
            <span style={{color:'#e4e4e7'}}>|</span>
            <span style={{color:'#059669', fontWeight:500}}>{en ? 'Open to Altos Ventures' : '알토스벤처스 지원'}</span>
          </div>
          <div style={{marginTop:28, height:1, background:'linear-gradient(90deg, #e4e4e7, #f4f4f5, transparent)'}}/>
        </header>

        {/* Reading path context hint */}
        <div style={{
          marginBottom:40, display:'flex', alignItems:'flex-start', gap:12,
          background: readingPath === 'scan' ? '#fefce8' : '#eef2ff',
          border: `1px solid ${readingPath === 'scan' ? '#fde68a' : '#e0e7ff'}`,
          borderRadius:8, padding:'14px 16px',
          animation:'fadeSlideIn .5s ease-out',
        }}>
          <span style={{fontSize:16, flexShrink:0, marginTop:-1}}>
            {readingPath === 'scan' ? '⚡' : readingPath === 'memo' ? '📄' : '🔍'}
          </span>
          <div>
            <p style={{fontSize:13, fontWeight:600, color: readingPath === 'scan' ? '#854d0e' : '#4338ca', marginBottom:2}}>
              {readingPath === 'scan'
                ? (en ? '90-Second Scan Mode' : '90초 스캔 모드')
                : readingPath === 'memo'
                ? (en ? '5-Minute Memo Mode' : '5분 메모 모드')
                : (en ? 'Full DD Review Mode' : '전체 DD 리뷰 모드')}
            </p>
            <p style={{fontSize:12.5, color: readingPath === 'scan' ? '#92400e' : 'rgba(79,70,229,.7)', lineHeight:1.5}}>
              {readingPath === 'scan'
                ? (en ? 'Read the thesis, scan the sidebar. Enough to know if this is worth 5 more minutes.' : '테시스를 읽고 사이드바를 스캔하세요. 5분 더 투자할 가치가 있는지 알 수 있습니다.')
                : readingPath === 'memo'
                ? (en ? 'Core narrative + risks. Hover any paragraph to ask the AI questions with evidence-grounded answers.' : '핵심 내러티브 + 리스크. 아무 문단에 마우스를 올리면 근거 기반 답변으로 AI에게 질문할 수 있습니다.')
                : (en ? 'All sections visible. Every claim has an evidence anchor (purple superscript). Hover paragraphs to open AI threads for stress-testing.' : '모든 섹션이 표시됩니다. 모든 주장에 근거 앵커가 있습니다 (보라색 위첨자). 문단에 마우스를 올려 AI 스레드를 열어 스트레스 테스트하세요.')}
            </p>
          </div>
        </div>

        {/* JD Coverage Matrix — always visible */}
        <div style={{marginBottom:56}}>
          <JDMatrixSection lang={lang}/>
        </div>

        {/* Memo sections */}
        <div style={{display:'flex', flexDirection:'column', gap:56}}>
          {SECTIONS.map((s) => {
            const visible = visibleSections.includes(s.id);
            const refCallback = (el) => { if (el) { el.dataset.sectionId = s.id; sectionRefs.current[s.id] = el; }};

            let content = null;
            if (s.id === 'risks') {
              content = <RisksSection lang={lang} visible={visible}/>;
            } else if (s.id === 'founderQuestions') {
              content = <FounderQuestionsSection lang={lang} visible={visible}/>;
            } else if (s.id === 'bullBear') {
              content = <BullBearSection lang={lang} visible={visible}/>;
            } else if (s.id === 'ninetyDay') {
              content = <NinetyDaySection lang={lang} visible={visible}/>;
            } else {
              content = <MemoBlock section={s} lang={lang} visible={visible} sessionId={sessionId}/>;
            }

            return <div key={s.id} ref={refCallback}>{content}</div>;
          })}
        </div>

        {/* Footer */}
        <footer style={{marginTop:80, paddingTop:32, borderTop:'1px solid #f4f4f5'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end'}}>
            <div>
              <p style={{fontSize:13, color:'#a1a1aa'}}>
                {en ? 'Prepared for Altos Ventures DD Review' : '알토스벤처스 DD 검토용 준비'}
              </p>
              <p style={{fontSize:11, color:'#d4d4d8', marginTop:4}}>
                {en
                  ? `All data sourced from verified professional records. ${Object.keys(EVIDENCE).length} evidence anchors tracked. AI responses grounded via RAG.`
                  : `모든 데이터는 검증된 전문 기록에서 출처. ${Object.keys(EVIDENCE).length}개 근거 앵커 추적 중. AI 응답은 RAG를 통해 근거화.`}
              </p>
            </div>
            <div style={{textAlign:'right'}}>
              <p style={{fontSize:13, color:'#52525b', fontWeight:500}}>Dong Jae Lee</p>
              <p style={{fontSize:11, color:'#a1a1aa'}}>leedj.1076@gmail.com</p>
            </div>
          </div>
        </footer>
      </article>

      {/* Quick-Scan sidebar */}
      <QuickScan lang={lang} open={scanOpen} onToggle={() => setScanOpen(!scanOpen)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
