  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<body>
<div id="root"></div>
<script type="text/babel">

      kr:'Devs United Games에서 단순히 "BD를 했다"가 아닙니다. 회사의 전체 글로벌 유통 채널을 구축했습니다. Meta Quest+, Apple Vision Pro, Google Play — 각각 다른 플랫폼 정치, 다른 협상 문화, 다른 기술 요구사항을 탐색해야 했습니다. 55% YoY 매출 성장은 하나의 큰 딜이 아닌, 세 가지 매우 다른 생태계에서 반복 가능한 파트너십 플레이북을 구축한 결과입니다.',
    },
  },

    text:{

      kr:'Flint Technologies는 가장 비싼 교육이었습니다. 4.5억원을 유치하고, 진정으로 혁신적인 GNN 기반 지식 플랫폼을 구축하고, 구매자들의 실제 관심으로 기업 파일럿을 확보했습니다. 그리고 실패했습니다. 기술이 나빠서가 아닙니다 — 시대를 앞섰습니다. 사용자 경험보다 알고리즘 정교함을 최적화했기 때문입니다. 온보딩 마찰이 너무 높았습니다. 파일럿은 체결됐지만 최종 사용자가 채택하지 않았습니다. "기술적으로 검증된 것"과 "시장 준비가 된 것"의 차이를 어렵게 배웠습니다. 그 교훈이 이제 모든 제품과 파트너십 결정을 형성합니다.',
    },
  },
  {
    id:'enterprise',
    title:{en:'Enterprise Sales DNA', kr:'엔터프라이즈 영업 DNA'},
    text:{
      en:'Before startups, I spent two years at TmaxSoft closing enterprise deals with Samsung, Hyundai, KT, and POSCO. Korean enterprise sales is relationship-driven and hierarchical — you don\'t just pitch a product, you navigate internal politics across multiple stakeholders over months. That experience gave me a muscle that most technical founders lack: the ability to sit in a room with enterprise executives, earn their trust, and turn a technical conversation into a commercial outcome.',
      kr:'스타트업 이전, TmaxSoft에서 2년간 삼성, 현대, KT, POSCO와 기업 딜을 클로징했습니다. 한국 기업 영업은 관계 중심이고 위계적입니다 — 단순히 제품을 피칭하는 것이 아니라, 수개월에 걸쳐 여러 이해관계자의 내부 정치를 탐색합니다. 그 경험은 대부분의 기술 창업자에게 없는 근육을 만들었습니다: 기업 임원과 한 방에 앉아 신뢰를 얻고, 기술 대화를 상업적 결과로 전환하는 능력.',
    },
  },
];

const TIMELINE = [
  {period:{en:'2023 – Present', kr:'2023 – 현재'}, role:{en:'Director, Business Development', kr:'사업개발 디렉터'}, company:'Devs United Games', highlight:{en:'55% YoY revenue growth via Meta, Apple, Google partnerships', kr:'Meta, Apple, Google 파트너십으로 55% YoY 매출 성장'}, chatQ:{en:'Tell me about the Meta Quest+ partnership.', kr:'Meta Quest+ 파트너십에 대해 알려주세요.'}},
  {period:'2020 – 2023', role:{en:'Co-Founder & COO', kr:'공동창업자 & COO'}, company:'Flint Technologies', highlight:{en:'Built GNN recommendation platform, raised ₩450M, enterprise pilots', kr:'GNN 추천 플랫폼 구축, 4.5억 유치, 기업 파일럿'}, chatQ:{en:'What did DJ learn from his startup failure?', kr:'스타트업 실패에서 무엇을 배웠나요?'}},
  {period:'2018 – 2020', role:{en:'Team Lead, Business Development', kr:'사업개발 팀리드'}, company:{en:'TmaxSoft (TmaxTibero)', kr:'티맥스소프트 (TmaxTibero)'}, highlight:{en:'Enterprise deals with Samsung, Hyundai, KT, POSCO', kr:'삼성, 현대, KT, POSCO 기업 딜'}, chatQ:{en:'How does DJ approach enterprise sales?', kr:'DJ는 엔터프라이즈 영업을 어떻게 접근하나요?'}},
  {period:'2015 – 2018', role:{en:'M.S. Industrial & Systems Engineering', kr:'산업 및 시스템 공학 석사'}, company:{en:'KAIST + KIT (Germany)', kr:'KAIST + KIT (독일)'}, highlight:{en:'Dual degree, Cum Laude, Dean\'s List', kr:'복수학위, 우등졸업, 학장 리스트'}, chatQ:{en:'Tell me about DJ\'s education.', kr:'DJ의 학력에 대해 알려주세요.'}},
];

const STARTER_QUESTIONS = {
  en: [
    'What makes DJ different from other candidates?',
    'Tell me about the Meta Quest+ partnership.',
    'What did DJ learn from his startup failure?',
    'What\'s DJ\'s technical stack?',
    'How does DJ approach business development?',
    'What was DJ\'s role at Flint Technologies?',
  ],
  kr: [
    'DJ를 다른 후보자와 차별화하는 것은 무엇인가요?',
    'Meta Quest+ 파트너십에 대해 알려주세요.',
    '스타트업 실패에서 무엇을 배웠나요?',
    'DJ의 기술 스택은 무엇인가요?',
    'DJ는 사업개발을 어떻게 접근하나요?',
    'Flint Technologies에서의 역할은 무엇이었나요?',
  ],
};

/* ═══════════════════════════════════════════════════════
   MARKDOWN RENDERER (simple)
   ═══════════════════════════════════════════════════════ */
function MemoMd({text}) {
  if (!text) return null;
  const html = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n- /g, '<br/>• ')
    .replace(/\n\* /g, '<br/>• ')
    .replace(/\n\n/g, '<br/><br/>')
    .replace(/\n/g, '<br/>');
  return <span dangerouslySetInnerHTML={{__html: html}}/>;
}

/* ═══════════════════════════════════════════════════════
   CHAT PANEL
   ═══════════════════════════════════════════════════════ */
function ChatPanel({lang}) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [streaming, setStreaming] = useState(false);
  const [sessionId] = useState(() => 'v14-' + Math.random().toString(36).slice(2,10));
  const inputRef = useRef(null);
  const endRef = useRef(null);
  const en = lang === 'en';

  useEffect(() => { endRef.current?.scrollIntoView({behavior:'smooth'}); }, [messages]);

  const sendMessage = async (q) => {
    if (!q?.trim() || streaming) return;
    const question = q.trim();

    const allMessages = messages.map(m => ({role:m.role, content:m.text}));
    allMessages.push({role:'user', content:question});

    const history = messages.map(m => ({role:m.role, text:m.text}));

    setMessages(p => [...p, {role:'user', text:question}]);
    setInput('');
    setStreaming(true);

    const assistantIdx = messages.length + 1;
    setMessages(p => [...p, {role:'assistant', text:''}]);

    try {
      const res = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          messages: allMessages,
          visitorData: {persona:'hiring_manager', focus:'full_stack'},
          lang: lang === 'kr' ? 'ko' : 'en',
          sessionId,
        }),
      });

      if (!res.ok) {
        const fallbackRes = await fetch('/api/ui-chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({query:question, personaId:'hm', focusId:'full_stack', history}),
        });
        const data = await fallbackRes.json();
        setMessages(p => {
          const u = [...p];
          u[assistantIdx] = {role:'assistant', text:data.response || (en ? 'Unable to generate a response.' : '응답을 생성할 수 없습니다.')};
          return u;
        });
        setStreaming(false);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let accumulated = '';
      let lineBuffer = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        lineBuffer += decoder.decode(value, {stream:true});
        const lines = lineBuffer.split('\n');
        lineBuffer = lines.pop() || '';
        for (const line of lines) {
          if (line.startsWith('0:')) {
            try {
              const text = JSON.parse(line.slice(2));
              accumulated += text;
              setMessages(p => {
                const u = [...p];
                u[assistantIdx] = {role:'assistant', text:accumulated};
                return u;
              });
            } catch {}
          }
        }
      }

      if (!accumulated) {
        setMessages(p => {
          const u = [...p];
          u[assistantIdx] = {role:'assistant', text:en ? 'Response completed.' : '응답 완료.'};
          return u;
        });
      }
    } catch {
      setMessages(p => {
        const u = [...p];
        u[assistantIdx] = {role:'assistant', text:en ? 'Connection error. Please try again.' : '연결 오류. 다시 시도해주세요.'};
        return u;
      });
    }
    setStreaming(false);
  };

  // Pick 3 random indices once, then derive display text from current lang
  const [starterIndices] = useState(() => {
    const indices = STARTER_QUESTIONS.en.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices.slice(0, 3);
  });
  const starterSet = starterIndices.map(i => STARTER_QUESTIONS[lang][i]);

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%'}}>
      {/* Chat header */}
      <div style={{padding:'20px 24px 16px', borderBottom:'1px solid #f0f0f0'}}>
        <div style={{display:'flex', alignItems:'center', gap:8}}>
          <div style={{width:7, height:7, borderRadius:'50%', background:'#22c55e', animation:'pulse 2.5s infinite'}}/>
          <span style={{fontSize:13, fontWeight:500, color:'#1a1a1a'}}>Ask DJ</span>
          <span style={{fontSize:11, color:'#979797', marginLeft:4}}>— {en ? 'AI-powered' : 'AI 기반'}</span>
        </div>
        <p style={{fontSize:12, color:'#979797', marginTop:4, lineHeight:1.5}}>
          {en
            ? 'Ask anything about my experience, skills, or career. Answers are grounded in verified professional data.'
            : '경력, 기술, 커리어에 대해 무엇이든 물어보세요. 검증된 전문 데이터에 기반한 답변입니다.'}
        </p>
      </div>

      {/* Messages */}
      <div className="sb" style={{flex:1, overflowY:'auto', padding:'16px 24px'}}>
        {messages.length === 0 && (
          <div style={{animation:'fadeIn .4s ease-out'}}>
            <p style={{fontSize:13, color:'#979797', marginBottom:16}}>
              {en ? 'Try one of these:' : '다음 중 하나를 시도해보세요:'}
            </p>
            <div style={{display:'flex', flexDirection:'column', gap:8}}>
              {starterSet.map((q, i) => (
                <button key={i} onClick={() => sendMessage(q)}
                  style={{
                    textAlign:'left', padding:'10px 14px', fontSize:13, color:'#1a1a1a',
                    background:'#fafafa', border:'1px solid #f0f0f0', borderRadius:8,
                    cursor:'pointer', fontFamily:'Inter,sans-serif', lineHeight:1.5,
                    transition:'all .15s',
                  }}
                  onMouseEnter={e => {e.currentTarget.style.background='#f0fdf4'; e.currentTarget.style.borderColor='#bbf7d0';}}
                  onMouseLeave={e => {e.currentTarget.style.background='#fafafa'; e.currentTarget.style.borderColor='#f0f0f0';}}
                >
                  {q}
                </button>
              ))}
            </div>
          </div>
        )}

        {messages.map((m, i) => (
          <div key={i} style={{marginBottom:12, animation:'slideUp .25s ease-out'}}>
            {m.role === 'user' ? (
              <div style={{display:'flex', justifyContent:'flex-end'}}>
                <div style={{
                  maxWidth:'80%', padding:'10px 14px', borderRadius:'14px 14px 4px 14px',
                  background:'#1a1a1a', color:'#fff', fontSize:13, lineHeight:1.6,
                }}>
                  {m.text}
                </div>
              </div>
            ) : (
              <div style={{display:'flex', justifyContent:'flex-start'}}>
                <div style={{
                  maxWidth:'85%', padding:'12px 16px', borderRadius:'14px 14px 14px 4px',
                  background:'#f8f8f8', border:'1px solid #f0f0f0',
                  fontSize:13, color:'#1a1a1a', lineHeight:1.7,
                }}>
                  <MemoMd text={m.text}/>
                  {streaming && i === messages.length - 1 && m.text !== '' && (
                    <span style={{display:'inline-block', width:2, height:13, background:'#1a1a1a', marginLeft:2, animation:'pulse 1s infinite', verticalAlign:'text-bottom'}}/>
                  )}
                </div>
              </div>
            )}
          </div>
        ))}

        {streaming && messages.length > 0 && messages[messages.length-1].text === '' && (
          <div style={{display:'flex', gap:4, padding:12}}>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#d6d6d6',animation:'pulse 1.2s infinite'}}/>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#d6d6d6',animation:'pulse 1.2s .15s infinite'}}/>
            <span style={{width:5,height:5,borderRadius:'50%',background:'#d6d6d6',animation:'pulse 1.2s .3s infinite'}}/>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Input */}
      <form onSubmit={e => {e.preventDefault(); sendMessage(input);}}
        style={{padding:'12px 24px 20px', borderTop:'1px solid #f0f0f0', display:'flex', gap:8}}>
        <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} disabled={streaming}
          placeholder={en ? 'Ask me anything...' : '무엇이든 물어보세요...'}
          style={{
            flex:1, fontSize:13, padding:'10px 14px', border:'1px solid #e5e5e5', borderRadius:8,
            fontFamily:'Inter,sans-serif', color:'#1a1a1a', background:'#fff', outline:'none',
            transition:'border-color .15s',
          }}
          onFocus={e => e.target.style.borderColor='#22c55e'}
          onBlur={e => e.target.style.borderColor='#e5e5e5'}
        />
        <button type="submit" disabled={streaming || !input.trim()}
          style={{
            fontSize:12, fontWeight:500, color:'#fff', padding:'10px 18px', borderRadius:8,
            border:'none', cursor: (streaming || !input.trim()) ? 'default' : 'pointer',
            fontFamily:'Inter,sans-serif', transition:'all .15s',
            background: (streaming || !input.trim()) ? '#d6d6d6' : '#1a1a1a',
          }}
          onMouseEnter={e => { if (!streaming && input.trim()) e.currentTarget.style.background='#333'; }}
          onMouseLeave={e => { if (!streaming && input.trim()) e.currentTarget.style.background='#1a1a1a'; }}
        >
          {en ? 'Send' : '전송'}
        </button>
      </form>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   HIGHLIGHT CARD (collapsible)
   ═══════════════════════════════════════════════════════ */
function HighlightCard({title, text}) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{
      border:'1px solid #f0f0f0', borderRadius:8, overflow:'hidden',
      transition:'all .2s',
      ...(open ? {borderColor:'#e5e5e5', background:'#fafafa'} : {}),
    }}>
      <button onClick={() => setOpen(o => !o)}
        style={{
          width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'10px 14px', border:'none', background:'transparent', cursor:'pointer',
          fontFamily:'Inter,sans-serif', textAlign:'left',
        }}>
        <span style={{fontSize:13, fontWeight:500, color:'#1a1a1a'}}>{title}</span>
        <span style={{
          fontSize:11, color:'#979797', transition:'transform .2s', display:'inline-block',
          transform: open ? 'rotate(180deg)' : 'rotate(0deg)',
        }}>▾</span>
      </button>
      {open && (
        <div style={{
          padding:'0 14px 14px', fontSize:12.5, color:'#676767', lineHeight:1.7,
          animation:'fadeIn .25s ease-out',
        }}>
          {text}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════ */
function ProfilePanel({lang}) {
  const en = lang === 'en';

  return (
    <div className="sb" style={{height:'100%', overflowY:'auto', padding:'40px 36px'}}>
      {/* Name & title */}
      <div style={{marginBottom:32}}>
        <h1 style={{fontSize:28, fontWeight:700, color:'#1a1a1a', letterSpacing:'-0.03em', lineHeight:1.2}}>
          Dong Jae Lee
        </h1>
        <p style={{fontSize:14, color:'#676767', marginTop:6, lineHeight:1.5}}>
          {en
            ? 'Operator → Builder → Strategist'
            : '운영자 → 빌더 → 전략가'}
        </p>
        <p style={{fontSize:13, color:'#979797', marginTop:4, lineHeight:1.6}}>
          {en
            ? 'Bridging deep tech and real-world business. 8+ years shipping products, closing enterprise deals, and building from zero to scale.'
            : '딥테크와 실제 비즈니스를 연결합니다. 8년+ 제품 출시, 기업 딜 클로징, 제로에서 스케일까지 구축 경험.'}
        </p>

      {/* Stats grid */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:1, background:'#f0f0f0', borderRadius:10, overflow:'hidden', marginBottom:32}}>
        {STATS.map((s, i) => {
          const label = typeof s.label === 'string' ? s.label : s.label[lang] || s.label.en;
          const value = typeof s.value === 'string' ? s.value : s.value[lang] || s.value.en;
          const detail = typeof s.detail === 'string' ? s.detail : s.detail[lang] || s.detail.en;
          return (
            <div key={i} style={{background:'#fff', padding:'14px 16px'}}>
              <div style={{fontSize:10, fontWeight:500, color:'#979797', textTransform:'uppercase', letterSpacing:'.08em', marginBottom:4}}>
                {label}
              </div>
              <div style={{fontSize:17, fontWeight:600, color:'#1a1a1a', letterSpacing:'-0.02em'}}>
                {value}
              </div>
              <div style={{fontSize:11, color:'#979797', marginTop:2, lineHeight:1.4}}>
                {detail}
              </div>
            </div>
          );
        })}
      </div>

      {/* Highlights — narrative depth */}
      <div style={{marginBottom:32}}>
        <div style={{fontSize:10, fontWeight:600, color:'#979797', textTransform:'uppercase', letterSpacing:'.1em', marginBottom:14}}>
          {en ? 'In My Own Words' : '제 이야기'}
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {HIGHLIGHTS.map(h => {
            const title = h.title[lang] || h.title.en;
            const text = h.text[lang] || h.text.en;
            return (
              <HighlightCard key={h.id} title={title} text={text}/>
            );
          })}
        </div>
      </div>

      {/* Timeline */}
      <div style={{marginBottom:32}}>
        <div style={{fontSize:10, fontWeight:600, color:'#979797', textTransform:'uppercase', letterSpacing:'.1em', marginBottom:16}}>
          {en ? 'Career' : '경력'}
        </div>
        <div style={{display:'flex', flexDirection:'column', gap:0}}>
          {TIMELINE.map((t, i) => (
            <div key={i} style={{
              display:'flex', gap:16, paddingBottom: i < TIMELINE.length - 1 ? 20 : 0,
              position:'relative',
            }}>
              {/* Timeline line */}
              <div style={{display:'flex', flexDirection:'column', alignItems:'center', width:12, flexShrink:0}}>
                <div style={{width:8, height:8, borderRadius:'50%', background: i === 0 ? '#22c55e' : '#d6d6d6', marginTop:2, flexShrink:0}}/>
                {i < TIMELINE.length - 1 && (
                  <div style={{width:1, flex:1, background:'#f0f0f0', marginTop:4}}/>
                )}
              </div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:10, color:'#979797', fontWeight:500, marginBottom:2}}>{t.period}</div>
                <div style={{fontSize:13, fontWeight:600, color:'#1a1a1a'}}>{t.role}</div>
                <div style={{fontSize:12, color:'#676767', marginTop:1}}>{t.company}</div>
                <div style={{fontSize:11.5, color:'#979797', marginTop:4, lineHeight:1.5}}>{t.highlight}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Links */}
      <div style={{display:'flex', gap:12, flexWrap:'wrap'}}>
        <a href="https://linkedin.com/in/dongjaelee1076" target="_blank" rel="noopener"
          style={{fontSize:12, color:'#676767', textDecoration:'none', padding:'6px 12px', border:'1px solid #e5e5e5', borderRadius:6, transition:'all .15s'}}
          onMouseEnter={e => {e.currentTarget.style.borderColor='#1a1a1a'; e.currentTarget.style.color='#1a1a1a';}}
          onMouseLeave={e => {e.currentTarget.style.borderColor='#e5e5e5'; e.currentTarget.style.color='#676767';}}
        >LinkedIn</a>
        <a href="mailto:leedj.1076@gmail.com"
          style={{fontSize:12, color:'#676767', textDecoration:'none', padding:'6px 12px', border:'1px solid #e5e5e5', borderRadius:6, transition:'all .15s'}}
          onMouseEnter={e => {e.currentTarget.style.borderColor='#1a1a1a'; e.currentTarget.style.color='#1a1a1a';}}
          onMouseLeave={e => {e.currentTarget.style.borderColor='#e5e5e5'; e.currentTarget.style.color='#676767';}}
        >Email</a>
        <a href="/ui" target="_blank" rel="noopener"
          style={{fontSize:12, color:'#979797', textDecoration:'none', padding:'6px 12px', border:'1px solid #f0f0f0', borderRadius:6, transition:'all .15s'}}
          onMouseEnter={e => {e.currentTarget.style.borderColor='#d6d6d6'; e.currentTarget.style.color='#676767';}}
          onMouseLeave={e => {e.currentTarget.style.borderColor='#f0f0f0'; e.currentTarget.style.color='#979797';}}
        >{en ? 'UI Lab' : 'UI 랩'}</a>
      </div>

      {/* Footer note */}
      <div style={{marginTop:32, paddingTop:20, borderTop:'1px solid #f0f0f0'}}>
        <p style={{fontSize:11, color:'#d6d6d6', lineHeight:1.5}}>
          {en
            ? 'This AI is grounded in verified professional data via RAG pipeline. Built by DJ.'
            : '이 AI는 RAG 파이프라인을 통해 검증된 전문 데이터에 기반합니다. DJ가 직접 구축.'}
        </p>
      </div>
    </div>
  );
}
