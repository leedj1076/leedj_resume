  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;scroll-snap-type:y proximity}
    body{font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes barGrow{from{width:0}}

    .fade-in{animation:fadeIn .5s ease both}
    .slide-r{animation:slideRight .5s cubic-bezier(.16,1,.3,1) both}

    .mono{font-family:'JetBrains Mono',monospace}
    .serif{font-family:'Instrument Serif',serif}
    button{cursor:pointer;border:none;background:none;font-family:inherit}
    input:focus,textarea:focus{outline:none}
    ::selection{background:rgba(99,102,241,.3)}
    .sb::-webkit-scrollbar{width:4px}.sb::-webkit-scrollbar-track{background:transparent}.sb::-webkit-scrollbar-thumb{background:rgba(128,128,128,.2);border-radius:4px}

/* --- Scroll progress indicator --- */
function ScrollProgress(){
  const t = useTheme();
  const [progress, setProgress] = useState(0);
  useEffect(()=>{
    const h=()=>{
      const d=document.documentElement;
      const p=(d.scrollTop)/(d.scrollHeight-d.clientHeight);
      setProgress(Math.min(1,Math.max(0,p)));
    };
    window.addEventListener('scroll',h,{passive:true});
    return ()=>window.removeEventListener('scroll',h);
  },[]);
  return <div style={{position:'fixed',top:0,left:0,right:0,height:2,zIndex:100,background:t.border}}>
    <div style={{height:'100%',width:`${progress*100}%`,background:`linear-gradient(90deg,${t.accent},${t.accent2},${t.accent3})`,transition:'width .1s'}}/>
  </div>;
}

/* ═══════════════════════════════════════

      <div className={visible?'fade-up':''} style={{opacity:visible?1:0,textAlign:'center',marginBottom:48}}>
        <span className="mono" style={{fontSize:11,letterSpacing:'.12em',color:t.accent,textTransform:'uppercase'}}>Proof Points</span>
        <h2 className="serif" style={{fontSize:40,color:t.text,marginTop:8,fontWeight:400,fontStyle:'italic'}}>
          Not claims — evidence
        </h2>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
        {ACHIEVEMENTS.map((a,i)=>{
          const isOpen = activeCard===i;
          return <div key={i}
            className={visible?`fade-up d${Math.min(i+1,6)}`:''} style={{opacity:visible?1:0}}
          >
            <div
              onClick={()=>setActiveCard(isOpen?null:i)}
              style={{
                padding:'20px 18px', borderRadius:14, cursor:'pointer',
                background:t.surface, border:`1px solid ${isOpen?a.color:t.border}`,
                transition:'all .3s', height:'100%',
                borderTop:`3px solid ${a.color}`,
                boxShadow:isOpen?`0 4px 24px ${a.color}10`:'none',
              }}
              onMouseEnter={e=>{if(!isOpen)e.currentTarget.style.borderColor=a.color+'60'}}
              onMouseLeave={e=>{if(!isOpen)e.currentTarget.style.borderColor=t.border}}
            >
              {/* Metric badge */}
              <div className="mono" style={{
                display:'inline-block',fontSize:11,padding:'4px 10px',borderRadius:6,
                background:`${a.color}12`,color:a.color,fontWeight:600,marginBottom:12,
                letterSpacing:'.02em',
              }}>{a.metric}</div>

              {/* Headline */}
              <h3 style={{fontSize:15,fontWeight:700,color:t.text,lineHeight:1.4,marginBottom:8,letterSpacing:'-0.01em'}}>
                {a.headline}
              </h3>

              {/* Org + period */}
              <div className="mono" style={{fontSize:10,color:t.textMut,marginBottom:isOpen?12:0}}>
                {a.org} · {a.period}
              </div>

              {/* Expandable "so what?" */}
              {isOpen && <div style={{animation:'fadeIn .3s ease'}}>
                <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${t.border}`}}>
                  <div className="mono" style={{fontSize:9,letterSpacing:'.1em',color:a.color,marginBottom:6,textTransform:'uppercase'}}>So what?</div>
                  <p style={{fontSize:13,color:t.textSec,lineHeight:1.65}}>{a.soWhat}</p>
                </div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:10}}>
                  {a.tags.map(tag=>(
                    <span key={tag} className="mono" style={{fontSize:9,padding:'3px 8px',borderRadius:4,
                      background:t.accentSoft,color:t.textMut}}>{tag}</span>
                  ))}
                </div>
              </div>}
            </div>
          </div>;
        })}
      </div>
    </div>
  </section>;
}

/* ═══════════════════════════════════════
   SECTION 5: CHAT CTA
   "Seen enough? Or want specifics?"
   ═══════════════════════════════════════ */
function ChatCTA(){
  const t = useTheme();
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  const [input, setInput] = useState('');
  const [messages, setMessages] = useState([]);
  const [chatOpen, setChatOpen] = useState(false);

  useEffect(()=>{
    const obs = new IntersectionObserver(([e])=>{if(e.isIntersecting)setVisible(true)},{threshold:0.3});
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);

  const suggestedQs = [
    "How did DJ navigate Apple's indirect culture?",
    "What was Flint's GNN recommendation system?",
    "Walk me through the Meta Quest+ decision",
    "What's DJ's negotiation philosophy?",
  ];

  const handleSend = async (text)=>{
    const q = text || input;
    if(!q.trim()) return;
    const history = messages.map(m=>({role:m.role,text:m.text}));
    setMessages(prev=>[...prev,{role:'user',text:q},{role:'bot',text:'Thinking...'}]);
    setInput(''); setChatOpen(true);
    try{
      const res = await fetch('/api/ui-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,personaId:'hiring',focusId:'fullstack',history})});
      const data = await res.json();
      setMessages(prev=>[...prev.slice(0,-1),{role:'bot',text:data.response||'Sorry, something went wrong.'}]);
    }catch(e){
      setMessages(prev=>[...prev.slice(0,-1),{role:'bot',text:'Sorry, something went wrong. Please try again.'}]);
    }
  };

  return <section id="section-chat" ref={ref} className="snap-section" style={{
    background:t.bg2, padding:'80px 48px', minHeight:'100vh',
    display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center',
  }}>
    <div style={{maxWidth:640,width:'100%'}}>
      <div className={visible?'fade-up':''} style={{opacity:visible?1:0,textAlign:'center',marginBottom:40}}>
        <span className="mono" style={{fontSize:11,letterSpacing:'.12em',color:t.accent,textTransform:'uppercase'}}>Go Deeper</span>
        <h2 className="serif" style={{fontSize:40,color:t.text,marginTop:8,fontWeight:400,fontStyle:'italic'}}>
          {chatOpen ? "Ask anything" : "Seen enough? Or dig deeper."}
        </h2>
        {!chatOpen && <p style={{fontSize:14,color:t.textMut,marginTop:8}}>
          DJ's AI answers from a knowledge base of resume data, interview stories, and project details.
        </p>}
      </div>

      {/* Suggested questions */}
      {!chatOpen && <div className={visible?'fade-up d2':''} style={{opacity:visible?1:0,
        display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',marginBottom:32}}>
        {suggestedQs.map((q,i)=>(
          <button key={i} onClick={()=>handleSend(q)} style={{
            padding:'10px 16px',borderRadius:10,fontSize:13,color:t.textSec,
            background:t.surface,border:`1px solid ${t.border}`,transition:'all .2s',
          }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=t.accent;e.currentTarget.style.color=t.text}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=t.border;e.currentTarget.style.color=t.textSec}}
          >{q}</button>
        ))}
      </div>}

      {/* Chat messages */}
      {chatOpen && <div className="sb" style={{maxHeight:300,overflowY:'auto',marginBottom:16,display:'flex',flexDirection:'column',gap:12}}>
        {messages.map((m,i)=>(
          <div key={i} style={{
            display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',
            animation:'fadeIn .3s ease',
          }}>
            <div style={{
              maxWidth:'80%',padding:'12px 16px',borderRadius:12,fontSize:14,lineHeight:1.6,
              background:m.role==='user'?t.accent:t.surface,
              color:m.role==='user'?'#fff':t.text,
              border:m.role==='bot'?`1px solid ${t.border}`:'none',
            }}>{m.text}</div>
          </div>
        ))}
      </div>}

      {/* Input */}
      <div className={visible?'fade-up d3':''} style={{opacity:visible?1:0,
        display:'flex',gap:8,background:t.surface,padding:8,borderRadius:14,border:`1px solid ${t.border}`}}>
        <input
          value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter')handleSend()}}
          placeholder="Ask about DJ's experience, skills, or stories…"
          style={{flex:1,padding:'12px 16px',fontSize:14,background:'transparent',
            border:'none',color:t.text,fontFamily:'Inter'}}
        />
        <button onClick={()=>handleSend()} style={{
          padding:'10px 20px',borderRadius:10,fontSize:13,fontWeight:600,
          background:t.accent,color:'#fff',transition:'all .2s',
        }}
        onMouseEnter={e=>e.currentTarget.style.opacity='.85'}
        onMouseLeave={e=>e.currentTarget.style.opacity='1'}
        >Ask</button>
      </div>

      {/* Bottom links */}
      <div className={visible?'fade-up d4':''} style={{opacity:visible?1:0,
        display:'flex',justifyContent:'center',gap:24,marginTop:32}}>
        <a href="https://www.linkedin.com/in/dongjae-lee/" target="_blank" rel="noopener"
          style={{fontSize:13,color:t.textMut,textDecoration:'none',transition:'color .2s'}}
          onMouseEnter={e=>e.currentTarget.style.color=t.accent}
          onMouseLeave={e=>e.currentTarget.style.color=t.textMut}
        >LinkedIn →</a>
        <span style={{color:t.border}}>|</span>
        <a href="mailto:leedj.1076@gmail.com"
          style={{fontSize:13,color:t.textMut,textDecoration:'none',transition:'color .2s'}}
          onMouseEnter={e=>e.currentTarget.style.color=t.accent}
          onMouseLeave={e=>e.currentTarget.style.color=t.textMut}
        >Email →</a>
      </div>
    </div>
  </section>;
}

/* ═══════════════════════════════════════
   APP
   ═══════════════════════════════════════ */
function App(){
  const [mode,setMode] = useState('dark');
  const [activeSection,setActiveSection] = useState(0);
  const t = themes[mode];

  // Track active section via intersection observer
  useEffect(()=>{
    const observers = [];
    SECTIONS.forEach((s,i)=>{
      const el = document.getElementById(`section-${s}`);
      if(!el) return;
      const obs = new IntersectionObserver(([e])=>{
        if(e.isIntersecting && e.intersectionRatio > 0.3) setActiveSection(i);
      },{threshold:0.3});
      obs.observe(el);
      observers.push(obs);
    });
    return ()=>observers.forEach(o=>o.disconnect());
  },[]);

  return <ThemeCtx.Provider value={t}>
    <div style={{background:t.bg,color:t.text,minHeight:'100vh',transition:'background .4s,color .3s'}}>
      <ScrollProgress/>
      <SectionNav active={activeSection}/>
      <ThemeToggle isDark={mode==='dark'} toggle={()=>setMode(m=>m==='dark'?'light':'dark')}/>
      <HookSection/>
      <div style={{height:1,background:t.sectionDivider}}/>
      <RaritySection/>
      <div style={{height:1,background:t.sectionDivider}}/>
      <ChecklistSection/>
      <div style={{height:1,background:t.sectionDivider}}/>
      <EvidenceSection/>
      <div style={{height:1,background:t.sectionDivider}}/>
      <ChatCTA/>
    </div>
  </ThemeCtx.Provider>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
