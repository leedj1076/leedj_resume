const SUGGESTIONS = [

function getSuggestion(input) {
  if (!input) return SUGGESTIONS[0];
  const lower = input.toLowerCase();
  return SUGGESTIONS.find(s => s.toLowerCase().startsWith(lower) && s.toLowerCase() !== lower) || '';
}

/* ═══════════════════════════════════════════
   STREAMING TEXT HOOK
   ═══════════════════════════════════════════ */
function useStreamText(text, speed = 12) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  useEffect(() => {
    if (!text) { setDisplayed(''); setDone(true); return; }
    setDisplayed('');
    setDone(false);
    let i = 0;
    const id = setInterval(() => {
      i += 1 + Math.floor(Math.random() * 2);
      if (i >= text.length) { setDisplayed(text); setDone(true); clearInterval(id); }
      else setDisplayed(text.slice(0, i));
    }, speed);
    return () => clearInterval(id);
  }, [text, speed]);
  return [displayed, done];
}

/* ═══════════════════════════════════════════
   TERMINAL LINE COMPONENT
   ═══════════════════════════════════════════ */
function Line({text, color = 'text-zinc-400'}) {
  if (!text) return <div className="h-3"/>;
  return <div className={`${color} text-[13px] leading-relaxed whitespace-pre font-mono`}>{text}</div>;
}

/* ═══════════════════════════════════════════
   STREAMING RAG RESPONSE
   ═══════════════════════════════════════════ */
function StreamLine({text}) {
  const [displayed, done] = useStreamText(text, 8);
  return (
    <div className="text-emerald-400 text-[13px] leading-relaxed whitespace-pre-wrap font-mono">
      {displayed}{!done && <span className="cursor-blink text-emerald-500">▊</span>}
    </div>
  );
}

/* ═══════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════ */
function App() {
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState('');
  const [booted, setBooted] = useState(false);
  const [busy, setBusy] = useState(false);
  const [history, setHistory] = useState([]);
  const [histIdx, setHistIdx] = useState(-1);
  const [ragResponse, setRagResponse] = useState(null);
  const [chatHistory, setChatHistory] = useState([]);
  const endRef = useRef(null);
  const inputRef = useRef(null);

  // Auto-scroll
  useEffect(() => { endRef.current?.scrollIntoView({behavior:'smooth'}); }, [lines, ragResponse]);

  // Focus input on click anywhere
  useEffect(() => {
    const handler = () => inputRef.current?.focus();
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  // Boot sequence
  useEffect(() => {
    let timeouts = [];
    let cumDelay = 0;
    BOOT.forEach((b, i) => {
      cumDelay += b.d;
      timeouts.push(setTimeout(() => {
        setLines(p => [...p, {t: b.t, c: b.c}]);
        if (i === BOOT.length - 1) {
          setBooted(true);
          inputRef.current?.focus();
        }
      }, cumDelay));
    });
    return () => timeouts.forEach(clearTimeout);
  }, []);

  // Add static lines helper
  const addLines = useCallback((newLines) => {
    setLines(p => [...p, ...newLines]);
  }, []);

  // Execute command
  const exec = useCallback(async (raw) => {
    const cmd = raw.trim();
    if (!cmd) return;

    // Add command to history
    setHistory(p => [cmd, ...p.slice(0, 49)]);
    setHistIdx(-1);

    // Echo command
    addLines([{t: `altos_partner@djl-dd-room:~$ ${cmd}`, c: 'text-zinc-300'}]);

    const lower = cmd.toLowerCase();

    // Clear
    if (lower === 'clear') {
      setLines([]);
      setRagResponse(null);
      return;
    }

    // Help
    if (lower === 'help') { addLines(HELP_OUTPUT); return; }

    // Metrics
    if (lower === 'run ./fetch_metrics' || lower === 'run ./fetch_metrics --target=dug') {
      addLines(METRICS_OUTPUT); return;
    }

    // Cat files
    if (lower === 'cat exec_summary.md') { addLines(EXEC_SUMMARY); return; }
    if (lower === 'cat post_mortem.md' || lower === 'cat post_mortem_flint.md') { addLines(POST_MORTEM); return; }
    if (lower === 'cat thesis.md') { addLines(THESIS_OUTPUT); return; }
    if (lower === 'cat skills.md') { addLines(SKILLS_OUTPUT); return; }

    // ls
    if (lower === 'ls' || lower === 'ls -la' || lower === 'ls -l') { addLines(LS_OUTPUT); return; }

    // whoami
    if (lower === 'whoami') { addLines(WHOAMI_OUTPUT); return; }

    // status
    if (lower === 'status') { addLines(STATUS_OUTPUT); return; }

    // Easter eggs
    if (lower.startsWith('sudo')) {
      addLines([{t:'[AUTH] Nice try. DJL has nothing to hide. Use "ask" for full transparency.', c:'text-amber-400'}]);
      return;
    }
    if (lower === 'rm -rf /' || lower === 'rm -rf /*') {
      addLines([{t:'[SYS] Permission denied. This data room is read-only. Try "ask" instead.', c:'text-amber-400'}]);
      return;
    }
    if (lower === 'exit' || lower === 'quit') {
      addLines([{t:'[SYS] You can check out any time you like, but you can never leave. Try "ask" instead.', c:'text-zinc-500'}]);
      return;
    }

    // ASK — RAG query
    const askMatch = cmd.match(/^ask\s+["']?(.+?)["']?\s*$/i);
    if (askMatch) {
      const query = askMatch[1];
      setBusy(true);
      addLines([{t:'[RAG] Initializing query...', c:'text-zinc-600'}]);
      addLines([{t:`[RAG] Embedding: "${query.slice(0,60)}${query.length>60?'...':''}"`, c:'text-zinc-600'}]);
      addLines([{t:'[RAG] Searching Pinecone index... retrieving top-k chunks...', c:'text-zinc-600'}]);

      try {
        const res = await fetch('/api/ui-chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            query,
            personaId: 'vc',
            focusId: 'leadership',
            history: chatHistory,
          }),
        });
        const data = await res.json();
        const responseText = data.response || 'ERROR: No response generated.';

        // Update chat history for multi-turn
        setChatHistory(p => [...p, {role:'user', text:query}, {role:'assistant', text:responseText}]);

        // Show chunks used
        if (data.chunksUsed && data.chunksUsed.length > 0) {
          addLines([{t:`[RAG] Sources: ${data.chunksUsed.slice(0,5).join(', ')}`, c:'text-zinc-600'}]);
        }
        addLines([{t:'', c:''}]);

        // Stream the response
        setRagResponse(responseText);
      } catch(e) {
        addLines([{t:'[ERROR] Connection failed. Check network and retry.', c:'text-red-400'}]);
      }
      setBusy(false);
      return;
    }

    // Unknown command
    addLines([{t:`djl-sh: command not found: ${cmd.split(' ')[0]}`, c:'text-red-400'},
              {t:'Type "help" for available commands.', c:'text-zinc-600'}]);
  }, [addLines, chatHistory]);

  // Handle submit
  const handleSubmit = (e) => {
    e.preventDefault();
    if (!input.trim() || busy) return;
    // If there's a streaming response pending, commit it to lines first
    if (ragResponse) {
      setLines(p => [...p, {t: ragResponse, c: 'text-emerald-400', raw: true}, {t:'', c:''}]);
      setRagResponse(null);
    }
    exec(input);
    setInput('');
  };

  // Handle keydown for history + tab autocomplete
  const handleKeyDown = (e) => {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length > 0) {
        const next = Math.min(histIdx + 1, history.length - 1);
        setHistIdx(next);
        setInput(history[next]);
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx > 0) {
        const next = histIdx - 1;
        setHistIdx(next);
        setInput(history[next]);
      } else {
        setHistIdx(-1);
        setInput('');
      }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const suggestion = getSuggestion(input);
      if (suggestion) setInput(suggestion);
    }
  };

  const suggestion = !busy && booted ? getSuggestion(input) : '';

  return (
    <div className="crt screen-flicker h-screen w-full bg-zinc-950 flex flex-col p-6 md:p-8 overflow-hidden font-mono">

      {/* ═══ ASCII HEADER ═══ */}
      <div className="shrink-0 mb-4">
        <pre className="text-emerald-500/70 text-[10px] leading-[1.15] select-none">{ASCII_HEADER}</pre>
      </div>

      {/* ═══ TERMINAL OUTPUT ═══ */}
      <div className="flex-1 overflow-y-auto space-y-0.5 pb-4" onClick={() => inputRef.current?.focus()}>

        {lines.map((l, i) => (
          l.raw
            ? <div key={i} className={`${l.c} text-[13px] leading-relaxed whitespace-pre-wrap font-mono`}>{l.t}</div>
            : <Line key={i} text={l.t} color={l.c}/>
        ))}

        {/* Streaming RAG response */}
        {ragResponse && <StreamLine text={ragResponse} key={ragResponse}/>}

        {/* Busy indicator */}
        {busy && !ragResponse && (
          <div className="text-zinc-600 text-[13px]">
            <span className="cursor-blink">▊</span> Processing...
          </div>
        )}

        <div ref={endRef}/>
      </div>

      {/* ═══ COMMAND INPUT ═══ */}
      <div className="shrink-0 border-t border-zinc-800/50 pt-4">
        <form onSubmit={handleSubmit} className="flex items-center">
          <span className="text-emerald-500 text-[13px] shrink-0 select-none">
            altos_partner@djl-dd-room:~$&nbsp;
          </span>
          <div className="relative flex-1">
            {/* Ghost autocomplete */}
            {suggestion && (
              <div className="absolute inset-0 text-zinc-700 text-[13px] pointer-events-none whitespace-nowrap overflow-hidden">
                {suggestion}
              </div>
            )}
            <input
              ref={inputRef}
              value={input}
              onChange={e => { setInput(e.target.value); setHistIdx(-1); }}
              onKeyDown={handleKeyDown}
              disabled={!booted || busy}
              autoFocus
              spellCheck={false}
              autoComplete="off"
              className="w-full bg-transparent text-zinc-100 text-[13px] outline-none caret-emerald-400 relative z-10 disabled:opacity-30"
              style={{caretColor: '#34d399'}}
            />
          </div>
        </form>
        <div className="mt-2 text-[10px] text-zinc-800 select-none">
          TAB to autocomplete &middot; ↑↓ command history &middot; "help" for commands
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
